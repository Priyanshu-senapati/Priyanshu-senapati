<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="ULTRON: 19 Rust and Python processes on one authenticated WebSocket bus, each its own failure domain, with a hash-chained audit log. 337 tests across Rust and Python." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
