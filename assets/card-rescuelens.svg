<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="RescueLens: Names a crashed car’s make, model and year from one photo, then shows rescuers where EV high voltage runs. Says “not certain” instead of guessing. 94.55% top-1 accuracy across 196 car classes." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>RescueLens: Names a crashed car’s make, model and year from one photo, then shows rescuers where EV high voltage runs. Says “not certain” instead of guessing. 94.55% top-1 accuracy across 196 car classes.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1424"/><stop offset="1" stop-color="#10233f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f9dff"/><stop offset="1" stop-color="#38d6c4"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".07"/></pattern>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4f9dff" stop-opacity=".28"/><stop offset="1" stop-color="#4f9dff" stop-opacity="0"/></radialGradient>
</defs>
<style></style>
<rect width="600" height="330" rx="18" fill="#0d1b30"/>
<rect width="600" height="330" rx="18" fill="url(#dots)"/>
<rect x=".5" y=".5" width="599" height="329" rx="17.5" fill="none" stroke="#1f3556"/>
<rect x="32" y="0" width="64" height="4" rx="2" fill="url(#accent)"/>
<text x="32" y="44" font-size="13.5" font-weight="600" letter-spacing="1.5" fill="#8ea3bf">COMPUTER VISION · CV HACKATHON 2026</text>
<text x="32" y="86" font-size="31" font-weight="700" fill="#eef3fa">RescueLens</text>
<rect x="511.8" y="66" width="56.2" height="24.5" rx="12.25" fill="#38d6c4" fill-opacity=".16" stroke="#38d6c4" stroke-opacity=".55"/><text x="539.9" y="83.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#38d6c4">LIVE</text>
<text x="32" y="122" font-size="16.5" fill="#c3d0e2">Names a crashed car’s make, model and year from one photo, then</text>
<text x="32" y="146" font-size="16.5" fill="#c3d0e2">shows rescuers where EV high voltage runs. Says “not certain”</text>
<text x="32" y="170" font-size="16.5" fill="#c3d0e2">instead of guessing.</text>
<line x1="32" y1="206" x2="568" y2="206" stroke="#1f3556"/>
<text x="32" y="254" font-size="36" font-weight="700" fill="url(#accent)">94.55%</text>
<text x="183.3" y="236" font-size="15.5" fill="#8ea3bf">top-1 accuracy</text>
<text x="183.3" y="255" font-size="15.5" fill="#8ea3bf">across 196 car classes</text>
<rect x="32.0" y="276" width="79.7" height="26.5" rx="13.25" fill="none" fill-opacity="0" stroke="#4f9dff" stroke-opacity=".55"/><text x="71.9" y="295.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4f9dff">PyTorch</text>
<rect x="119.7" y="276" width="79.4" height="26.5" rx="13.25" fill="none" fill-opacity="0" stroke="#4f9dff" stroke-opacity=".55"/><text x="159.4" y="295.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4f9dff">YOLO11</text>
<rect x="207.1" y="276" width="105.3" height="26.5" rx="13.25" fill="none" fill-opacity="0" stroke="#4f9dff" stroke-opacity=".55"/><text x="259.8" y="295.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4f9dff">ONNX INT8</text>
<rect x="320.4" y="276" width="83.1" height="26.5" rx="13.25" fill="none" fill-opacity="0" stroke="#4f9dff" stroke-opacity=".55"/><text x="362.0" y="295.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4f9dff">FastAPI</text>
<rect x="411.6" y="276" width="61.6" height="26.5" rx="13.25" fill="none" fill-opacity="0" stroke="#4f9dff" stroke-opacity=".55"/><text x="442.3" y="295.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4f9dff">React</text>
</svg>
